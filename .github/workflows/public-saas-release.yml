name: LeadX Public SaaS Workers-first Release

on:
  push:
    branches: [feat/public-freemium-v1]

permissions:
  contents: read

concurrency:
  group: leadx-public-production-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release(public):')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LEADX_BASE_URL: https://leadx.simondalmasso44.workers.dev
      WRANGLER_VERSION: '4.111.0'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "RELEASE_SOURCE_SHA=$GITHUB_SHA"

      - name: Pre-deploy validation
        run: |
          npm --prefix web ci
          npm --prefix web audit --omit=dev --audit-level=high
          npm --prefix web run build
          npm --prefix web test
          npm --prefix web run typecheck
          node --check worker/runtime.mjs
          npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --outdir /tmp/leadx-public-bundle

      - name: Install browser smoke tooling
        run: |
          npm --prefix web install --no-save --package-lock=false @playwright/test@1.51.1
          cd web
          npx playwright install --with-deps chromium

      - name: Deploy once and validate without data mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          ARTIFACT_DIR="$RUNNER_TEMP/leadx-release"
          KV_TMP="$RUNNER_TEMP/leadx-kv-keys.json"
          mkdir -p "$ARTIFACT_DIR"

          deployments() {
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/leadx/deployments"
          }

          deployments_jq='
            def deployments:
              if (.result | type) == "array" then
                .result
              elif (.result | type) == "object"
                   and (.result.deployments | type) == "array" then
                .result.deployments
              else
                error("Unexpected Cloudflare deployments response schema")
              end;
            def latest_deployment:
              deployments | sort_by(.created_on // "") | reverse | .[0];
          '

          deployments > "$ARTIFACT_DIR/before.json"
          jq -e "${deployments_jq} .success == true and (deployments | length) > 0" "$ARTIFACT_DIR/before.json" >/dev/null
          PREVIOUS_DEPLOYMENT_ID="$(jq -r "${deployments_jq} latest_deployment.id // empty" "$ARTIFACT_DIR/before.json")"
          PREVIOUS_VERSION_ID="$(jq -r "${deployments_jq} latest_deployment.versions[]? | select(.percentage == 100) | .version_id" "$ARTIFACT_DIR/before.json" | head -n1)"
          test -n "$PREVIOUS_DEPLOYMENT_ID"
          test -n "$PREVIOUS_VERSION_ID"

          npx --yes wrangler@${WRANGLER_VERSION} kv key list --binding LEADX_KV --remote > "$KV_TMP"
          UNEXPECTED_NON_LX_KV_KEYS="$(jq '[.[].name | select(startswith("lx:") | not)] | length' "$KV_TMP")"
          rm -f "$KV_TMP"
          echo "UNEXPECTED_NON_LX_KV_KEYS=$UNEXPECTED_NON_LX_KV_KEYS"
          if [ "$UNEXPECTED_NON_LX_KV_KEYS" != "0" ]; then
            echo "KV_NAMESPACE_SAFETY=BLOCKED"
            echo "Release refuses to mutate or delete unexpected KV keys. Inventory them explicitly before another deploy."
            exit 1
          fi
          echo "KV_NAMESPACE_SAFETY=PASS"

          rollback() {
            echo "ROLLBACK_REQUESTED=YES"
            npx --yes wrangler@${WRANGLER_VERSION} rollback "$PREVIOUS_VERSION_ID" --message "LeadX automatic rollback: public SaaS release smoke failed"
            for _ in $(seq 1 60); do
              deployments > "$ARTIFACT_DIR/rollback.json"
              jq -e "${deployments_jq} .success == true and (deployments | length) > 0" "$ARTIFACT_DIR/rollback.json" >/dev/null
              restored="$(jq -r "${deployments_jq} latest_deployment.versions[]? | select(.percentage == 100) | .version_id" "$ARTIFACT_DIR/rollback.json" | head -n1)"
              if [ "$restored" = "$PREVIOUS_VERSION_ID" ]; then
                echo "ROLLBACK_STATE=completed"
                return 0
              fi
              sleep 2
            done
            echo "ROLLBACK_STATE=failed"
            return 1
          }

          echo "PREVIOUS_DEPLOYMENT_ID=$PREVIOUS_DEPLOYMENT_ID"
          echo "PREVIOUS_VERSION_ID=$PREVIOUS_VERSION_ID"
          echo "DEPLOY_ATTEMPT=1"

          set +e
          npx --yes wrangler@${WRANGLER_VERSION} deploy 2>&1 | tee "$ARTIFACT_DIR/deploy.log"
          DEPLOY_EXIT=${PIPESTATUS[0]}
          set -e
          echo "DEPLOY_CLI_EXIT=$DEPLOY_EXIT"

          NEW_DEPLOYMENT_ID=""
          NEW_VERSION_ID=""
          for _ in $(seq 1 90); do
            deployments > "$ARTIFACT_DIR/after.json" || { sleep 2; continue; }
            jq -e "${deployments_jq} .success == true and (deployments | length) > 0" "$ARTIFACT_DIR/after.json" >/dev/null || { sleep 2; continue; }
            candidate_deployment="$(jq -r "${deployments_jq} latest_deployment.id // empty" "$ARTIFACT_DIR/after.json")"
            candidate_version="$(jq -r "${deployments_jq} latest_deployment.versions[]? | select(.percentage == 100) | .version_id" "$ARTIFACT_DIR/after.json" | head -n1)"
            version_count="$(jq "${deployments_jq} latest_deployment.versions | length" "$ARTIFACT_DIR/after.json")"
            if [ "$candidate_deployment" != "$PREVIOUS_DEPLOYMENT_ID" ] && [ "$version_count" = "1" ] && [ -n "$candidate_version" ]; then
              NEW_DEPLOYMENT_ID="$candidate_deployment"
              NEW_VERSION_ID="$candidate_version"
              break
            fi
            sleep 2
          done

          if [ -z "$NEW_DEPLOYMENT_ID" ] || [ -z "$NEW_VERSION_ID" ]; then
            echo "DEPLOY_REMOTE_RECONCILIATION=NO_NEW_DEPLOYMENT"
            exit "$([ "$DEPLOY_EXIT" -ne 0 ] && echo "$DEPLOY_EXIT" || echo 1)"
          fi

          echo "DEPLOY_REMOTE_RECONCILIATION=PASS"
          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            echo "DEPLOY_CLI_AMBIGUOUS_BUT_REMOTE_ACCEPTED=YES"
          fi
          echo "NEW_DEPLOYMENT_ID=$NEW_DEPLOYMENT_ID"
          echo "NEW_VERSION_ID=$NEW_VERSION_ID"

          release_ready=false
          for attempt in $(seq 1 60); do
            curl -fsS "$LEADX_BASE_URL/api/health?release=$GITHUB_SHA&attempt=$attempt" > "$ARTIFACT_DIR/health.json" || true
            curl -fsS "$LEADX_BASE_URL/api/auth/session?release=$GITHUB_SHA&attempt=$attempt" > "$ARTIFACT_DIR/session.json" || true
            if jq -e '.status == "ok" and .service == "leadx" and .release == "leadx-public-freemium-v1" and .free_contact_limit == 100 and .write_protection == "ready"' "$ARTIFACT_DIR/health.json" >/dev/null 2>&1 \
              && jq -e '.authenticated == false and .mode == "preview"' "$ARTIFACT_DIR/session.json" >/dev/null 2>&1; then
              release_ready=true
              echo "RUNTIME_PROPAGATION_ATTEMPT=$attempt"
              break
            fi
            sleep 2
          done

          if ! $release_ready; then
            echo "RUNTIME_PROPAGATION_READY=NO"
            rollback
            exit 1
          fi
          echo "RUNTIME_PROPAGATION_READY=YES"

          EXPECTED_JS_ASSET="$(grep -oE '/assets/[^\"]+\.js' web/dist/index.html | head -n1)"
          test -n "$EXPECTED_JS_ASSET"
          echo "EXPECTED_JS_ASSET=$EXPECTED_JS_ASSET"
          ui_assets_ready=false
          for attempt in $(seq 1 60); do
            curl -fsS "$LEADX_BASE_URL/?asset_release=$GITHUB_SHA&attempt=$attempt" > "$ARTIFACT_DIR/public-index.html" || true
            if grep -Fq "$EXPECTED_JS_ASSET" "$ARTIFACT_DIR/public-index.html" \
              && curl -fsS "$LEADX_BASE_URL$EXPECTED_JS_ASSET?asset_release=$GITHUB_SHA&attempt=$attempt" -o /dev/null; then
              ui_assets_ready=true
              echo "PUBLIC_ASSET_PROPAGATION_ATTEMPT=$attempt"
              break
            fi
            sleep 2
          done

          if ! $ui_assets_ready; then
            echo "PUBLIC_ASSET_PROPAGATION_READY=NO"
            rollback
            exit 1
          fi
          echo "PUBLIC_ASSET_PROPAGATION_READY=YES"

          smoke_ok=true
          (cd web && npx playwright test scripts/public-production-smoke.spec.mjs --workers=1) 2>&1 | tee "$ARTIFACT_DIR/browser.log" || smoke_ok=false
          if ! $smoke_ok; then
            rollback
            exit 1
          fi
          echo "PRODUCTION_BROWSER_SMOKE=PASS"

          npx --yes wrangler@${WRANGLER_VERSION} kv key list --binding LEADX_KV --remote > "$KV_TMP"
          UNEXPECTED_NON_LX_KV_KEYS_AFTER="$(jq '[.[].name | select(startswith("lx:") | not)] | length' "$KV_TMP")"
          rm -f "$KV_TMP"
          echo "UNEXPECTED_NON_LX_KV_KEYS_AFTER=$UNEXPECTED_NON_LX_KV_KEYS_AFTER"
          test "$UNEXPECTED_NON_LX_KV_KEYS_AFTER" = "0"
          echo "KV_NAMESPACE_POST_DEPLOY=PASS"

          curl -fsS "$LEADX_BASE_URL/api/health?post_release=$GITHUB_SHA" | jq -e '.status == "ok" and .release == "leadx-public-freemium-v1" and .free_contact_limit == 100 and .write_protection == "ready"' >/dev/null
          curl -fsS "$LEADX_BASE_URL/api/auth/session?post_release=$GITHUB_SHA" | jq -e '.authenticated == false and .mode == "preview"' >/dev/null
          echo "POST_RELEASE_HTTP=PASS"
          echo "PRODUCTION_RELEASE=PASS"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadx-public-release-${{ github.sha }}
          path: ${{ runner.temp }}/leadx-release
          if-no-files-found: warn
          retention-days: 14
