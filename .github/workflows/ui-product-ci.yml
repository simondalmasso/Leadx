name: LeadX Public Product CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'worker/**'
      - 'worker.js'
      - 'wrangler.toml'
      - 'docs/**'
      - '.github/workflows/ui-product-ci.yml'
      - '.github/workflows/public-saas-release.yml'

permissions:
  contents: read

concurrency:
  group: leadx-public-product-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frozen dependencies
        run: npm --prefix web ci

      - name: Build
        run: npm --prefix web run build

      - name: Product contract tests
        run: npm --prefix web test

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Worker syntax
        run: node --check worker/runtime.mjs

      - name: Verify legacy product removed from active runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'fotomultas|repuestos_agricolas|repuestos agrícolas|reddit|radar|scraping' web/src worker wrangler.toml; then
            echo 'LEGACY_ACTIVE_RUNTIME=FAIL'
            exit 1
          fi
          echo 'LEGACY_ACTIVE_RUNTIME=ABSENT'

      - name: Wrangler dry-run
        run: npx --yes wrangler@4.111.0 deploy --dry-run --outdir /tmp/leadx-public-bundle

      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: leadx-public-preview-${{ github.event.pull_request.head.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 3
