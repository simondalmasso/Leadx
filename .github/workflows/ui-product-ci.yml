name: LeadX Public Product CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'worker/**'
      - 'worker.js'
      - 'wrangler.toml'
      - 'docs/**'
      - '.github/workflows/ui-product-ci.yml'
      - '.github/workflows/public-saas-release.yml'

permissions:
  contents: read

concurrency:
  group: leadx-public-product-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frozen dependencies
        run: npm --prefix web ci

      - name: Build
        run: npm --prefix web run build

      - name: Product contract tests
        run: npm --prefix web test

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Worker syntax
        run: node --check worker/runtime.mjs

      - name: Verify legacy product removed from active runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'fotomultas|repuestos_agricolas|repuestos agrícolas|reddit|radar|scraping' web/src worker wrangler.toml; then
            echo 'LEGACY_ACTIVE_RUNTIME=FAIL'
            exit 1
          fi
          echo 'LEGACY_ACTIVE_RUNTIME=ABSENT'

      - name: Wrangler dry-run
        run: npx --yes wrangler@4.111.0 deploy --dry-run --outdir /tmp/leadx-public-bundle

      - name: Install visual QA browser tooling
        run: |
          npm --prefix web install --no-save --package-lock=false @playwright/test@1.51.1
          cd web
          npx playwright install --with-deps chromium

      - name: Start local production preview
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web run preview -- --host 127.0.0.1 --port 4173 > /tmp/leadx-preview.log 2>&1 &
          echo $! > /tmp/leadx-preview.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "LOCAL_PREVIEW_READY_ATTEMPT=$attempt"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/leadx-preview.log
          exit 1

      - name: Multi-breakpoint visual QA
        env:
          LEADX_QA_BASE_URL: http://127.0.0.1:4173
        run: |
          cd web
          npx playwright test scripts/design-visual-qa.spec.mjs --workers=1

      - name: Upload static preview and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadx-public-preview-${{ github.event.pull_request.head.sha }}
          path: |
            web/dist
            web/test-results
            /tmp/leadx-preview.log
          if-no-files-found: warn
          retention-days: 3
