name: Patch HOVS V2 QA findings

on:
  push:
    branches: [agent/hovs-creative-direction-v2-candidate]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hovs-creative-direction-v2-candidate
      - name: Apply bounded QA corrections and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('web/src/App.tsx')
          text = app.read_text()
          old = '''        if (current.authenticated) {\n          setPlan(current.plan || EMPTY_PLAN);\n          await loadWorkspace();\n        }\n'''
          new = '''        if (current.authenticated) {\n          setPlan(current.plan || EMPTY_PLAN);\n          setLoading(false);\n          await loadWorkspace();\n        }\n'''
          assert text.count(old) == 1, text.count(old)
          app.write_text(text.replace(old, new))

          styles = Path('web/src/styles.css')
          text = styles.read_text()
          old = '.icon-button { width: 44px; height: 44px; padding: 0; display: inline-grid; place-items: center; background: transparent; border: 1px solid transparent; border-radius: var(--radius-control); cursor: pointer; transition: border-color var(--motion-fast), background var(--motion-fast); }'
          new = '.icon-button { width: 44px; min-width: 44px; height: 44px; flex: 0 0 44px; padding: 0; display: inline-grid; place-items: center; background: transparent; border: 1px solid transparent; border-radius: var(--radius-control); cursor: pointer; transition: border-color var(--motion-fast), background var(--motion-fast); }'
          assert text.count(old) == 1, text.count(old)
          styles.write_text(text.replace(old, new))

          qa = Path('web/scripts/design-visual-qa.spec.mjs')
          text = qa.read_text()
          replacements = [
            ('''  await expect(page.getByRole("dialog")).toBeVisible();\n  await expect(page.getByText(/Nombre, estado y próxima acción primero/i)).toBeVisible();\n  await assertNoOverflow(page);\n''', '''  await expect(page.getByRole("dialog")).toBeVisible();\n  await expect(page.getByText(/Nombre, estado y próxima acción primero/i)).toBeVisible();\n  await page.waitForTimeout(420);\n  await assertNoOverflow(page);\n'''),
            ('''  const sheet = page.getByRole("dialog");\n  await expect(sheet).toBeVisible();\n  const box = await sheet.boundingBox();\n''', '''  const sheet = page.getByRole("dialog");\n  await expect(sheet).toBeVisible();\n  await page.waitForTimeout(420);\n  const box = await sheet.boundingBox();\n'''),
            ('''  await mockWorkspace(page, { count: 8, delay: 1800 });\n  await page.goto(baseURL, { waitUntil: "domcontentloaded" });\n  await expect(page.locator(".ledger-loading")).toBeVisible({ timeout: 1200 });\n''', '''  await mockWorkspace(page, { count: 8, delay: 2500 });\n  await page.goto(baseURL, { waitUntil: "domcontentloaded" });\n  await expect(page.locator(".ledger-loading")).toBeVisible({ timeout: 1800 });\n'''),
            ('''  await page.getByRole("button", { name: /Crear espacio/i }).first().click();\n  await expect(page.getByRole("dialog")).toBeVisible();\n  await expect(page.getByRole("heading", { name: /100 clientes, en orden/i })).toBeVisible();\n  await assertMobileTargets(page);\n''', '''  await page.getByRole("button", { name: /Crear espacio/i }).first().click();\n  await expect(page.getByRole("dialog")).toBeVisible();\n  await expect(page.getByRole("heading", { name: /100 clientes, en orden/i })).toBeVisible();\n  await page.waitForTimeout(420);\n  await assertMobileTargets(page);\n'''),
          ]
          for old, new in replacements:
            assert text.count(old) == 1, (text.count(old), old[:60])
            text = text.replace(old, new)
          qa.write_text(text)
          PY
          rm .github/workflows/patch-hovs-v2-qa.yml
          node --check web/scripts/design-visual-qa.spec.mjs
          git diff --check
          git config user.name 'LeadX ARQ Design'
          git config user.email 'actions@users.noreply.github.com'
          git add web/src/App.tsx web/src/styles.css web/scripts/design-visual-qa.spec.mjs .github/workflows/patch-hovs-v2-qa.yml
          git commit -m 'fix: close HOVS V2 visual QA gaps'
          git push origin HEAD:agent/hovs-creative-direction-v2-candidate
